<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Trainer - SoluGrow</title><link rel='stylesheet' href='/styles.css'><script src='https://unpkg.com/@supabase/supabase-js@2'></script><script src='/app.js'></script></head><body><div class='container section'><h1>Trainer Dashboard</h1><div class='grid grid-3'><div class='card'><div class='kpi'>Assigned Members</div></div><div class='card'><div class='kpi'>Weekly Progress</div></div><div class='card'><div class='kpi'>Diet Plans</div></div></div><div class='card section'><h3>Assign Workout</h3><form id='wf' class='form-grid'><input name='member_id' placeholder='member id'><input name='exercise' placeholder='exercise'><input name='sets' placeholder='sets'><input name='reps' placeholder='reps'><input name='time' placeholder='time'><button class='btn'>Save Workout</button></form></div><button class='btn ghost' onclick='App.logout()'>Logout</button></div><script>App.requireAuth(['trainer']);document.getElementById('wf').onsubmit=async(e)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const p=await App.getProfile();d.trainer_id=p.id;await App.sb.from('workouts').insert(d);alert('Workout saved');};</script></body></html>
